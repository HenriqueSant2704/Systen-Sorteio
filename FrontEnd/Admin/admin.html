<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../FrontEnd/Admin/admin.css">
    <title>Painel Admin</title>
</head>
<body>
    <div class="container">
        <img class="logo" src="../../Assets/imgs/netico-logo.png" alt="Logo Netico">
        <div class="menu-painel">
            
            <div class="ciaxa-titulo">
                <div class="titulo">
                    <img src="../../Assets/Iconis/security.png" alt="">
                    <h1>Painel de Controle</h1>
                </div>

                <div class="quant-participante">
                    <span class="quant">Gerencie os 12 participantes cadastrados.</span>
                </div>
            </div>

            <div class="menu-acoes">
                <div class="caixa-input">
                    <img src="../../Assets/Iconis/search.png" alt="">
                    <input type="text" placeholder="Buscar participante...">
                </div>
                <button class="sortear">
                    <img src="../../Assets/Iconis/trophy.png" alt="">
                    Sortear Ganhador
                </button>
            </div>

        </div>

        <div class="listas-cadastro">
            <div class="container-lista">
                <div class="circulo">
                    <img src="../../Assets/Iconis/group.png" alt="">
                </div>
                <p>Nenhum cadastro ainda</p>
                <span>Os participantes aparecerão aqui automaticamente.</span>
            </div>

            <div class="paginacao">
                <div class="quant-pagina">
                    <span>Mostrando 1 a 8 de 12</span>
                </div>

                <div class="botoes-paginacao">
                    <button class="btn-paginacao">Anterior</button>
                    <div class="btn-paginacao">Página 1 de 2</div>
                    <button class="btn-paginacao">Próximo</button>  
                </div>
            </div>
        </div>
    </div>

    <script src="../../FrontEnd/Admin/admin.js"></script>
</body>
</html>
